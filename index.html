<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Feliz Aniversário, Larissa</title>

<!-- Fonte serifada elegante via Google Fonts (com fallback caso não haja internet) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">

<style>
  /* ======================================================
     CORES — altere aqui a paleta de cores da experiência
     ====================================================== */
  :root{
    --cor-fundo: #000;
    --cor-texto: #f7ecd8;         /* branco/dourado suave */
    --cor-dourado: #e9c98a;
    --cor-rosa: #f2c9c2;
    --sombra-texto: 0 2px 18px rgba(0,0,0,.75);
  }

  /* ======================================================
     FONTE — troque aqui a fonte usada em toda a página
     ====================================================== */
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%; height:100dvh;
    background:var(--cor-fundo);
    overflow:hidden;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  #stage{
    position:fixed; inset:0;
    width:100%; height:100dvh;
    overflow:hidden;
  }

  /* Fundo em vídeo/gif, tela cheia, sem distorção */
  #bgVideo{
    position:absolute; top:50%; left:50%;
    width:100%; height:100%;
    min-width:100%; min-height:100%;
    object-fit:cover;
    transform: translate(-50%,-50%) scale(1);
    animation: kenburns 22s ease-in-out infinite alternate;
    filter: saturate(0.95) brightness(0.9);
  }
  @keyframes kenburns{
    from{ transform:translate(-50%,-50%) scale(1); }
    to{ transform:translate(-50%,-50%) scale(1.09); }
  }

  /* Camada escura para leitura */
  #overlay{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.35) 35%, rgba(0,0,0,.65));
  }
  /* Vinheta */
  #vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.65) 100%);
  }

  /* Partículas douradas */
  #particles{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .particle{
    position:absolute; bottom:-10%;
    width:4px; height:4px;
    background: radial-gradient(circle, var(--cor-dourado), transparent 70%);
    border-radius:50%;
    opacity:.75;
    filter: drop-shadow(0 0 6px var(--cor-dourado));
    animation-name: subir;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes subir{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.8; }
    100%{ transform:translateY(-115vh) translateX(20px); opacity:0; }
  }

  /* Tela inicial */
  #startScreen{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:5;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: opacity .8s ease;
  }
  #startScreen.hidden{ opacity:0; pointer-events:none; }
  .start-text{
    color:var(--cor-texto);
    font-size:clamp(16px, 4.5vw, 22px);
    letter-spacing:.05em;
    text-shadow:var(--sombra-texto);
    animation: pulsar 2.4s ease-in-out infinite;
    text-align:center;
    padding: 0 24px;
  }
  @keyframes pulsar{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.03); }
  }

  /* Carta */
  #letterWrap{
    position:absolute; inset:0;
    z-index:4;
    display:flex; align-items:center; justify-content:center;
    padding:
      calc(env(safe-area-inset-top) + 28px)
      calc(env(safe-area-inset-right) + 26px)
      calc(env(safe-area-inset-bottom) + 28px)
      calc(env(safe-area-inset-left) + 26px);
    opacity:0;
    transition: opacity .6s ease;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  #letterWrap.visible{ opacity:1; }

  #letterText{
    color:var(--cor-texto);
    font-size:clamp(15px, 4.6vw, 24px);
    line-height:1.5;
    text-align:center;
    max-width:640px;
    width:100%;
    text-shadow:var(--sombra-texto);
    transition: opacity .55s ease, filter .55s ease, transform .55s ease;
    font-style:normal;
    overflow-wrap:break-word;
    word-break:break-word;
    margin: auto;
  }
  #letterText.hide{
    opacity:0;
    filter: blur(6px);
    transform: translateY(6px);
  }
  #letterText .em{ color:var(--cor-dourado); font-style:italic; }

  /* Dica de reinício */
  #restartHint{
    position:absolute;
    bottom: calc(env(safe-area-inset-bottom) + 22px);
    left:0; right:0;
    text-align:center;
    color:var(--cor-rosa);
    font-size:clamp(12px, 3vw, 15px);
    letter-spacing:.08em;
    opacity:0;
    transition: opacity 1s ease;
    z-index:6;
    pointer-events:none;
  }
  #restartHint.visible{ opacity:.85; }

  /* Zonas de toque invisíveis (apenas para debug, mantidas sem estilo visível) */
  #touchLayer{
    position:absolute; inset:0;
    z-index:7;
  }
</style>
</head>
<body>

<div id="stage">
  <!-- ======================================================
       VÍDEO / GIF DE FUNDO — troque o arquivo abaixo em BACKGROUND_URL
       ====================================================== -->
  <video id="bgVideo" autoplay muted loop playsinline preload="auto"></video>

  <div id="overlay"></div>
  <div id="vignette"></div>
  <div id="particles"></div>

  <!-- ======================================================
       MÚSICA — troque o arquivo abaixo em MUSIC_URL
       ====================================================== -->
  <audio id="bgMusic" loop preload="auto"></audio>

  <div id="startScreen">
    <p class="start-text">Toque na tela para começar ✨</p>
  </div>

  <div id="letterWrap">
    <p id="letterText"></p>
  </div>

  <div id="restartHint">Toque para viver novamente.</div>

  <div id="touchLayer"></div>
</div>

<script>
(function(){

  /* ============================================================
     ARQUIVOS — troque aqui os caminhos dos seus arquivos de mídia
     (coloque os arquivos no mesmo repositório do GitHub Pages)
     ============================================================ */
  const MUSIC_URL      = "bk-planos-instrumental.mp3"; // música (mp4 de áudio)
  const BACKGROUND_URL = "fundo.mp4";                  // vídeo/gif de fundo em loop

  /* ============================================================
     VELOCIDADE DA ESCRITA — ajuste os valores abaixo (em ms)
     ============================================================ */
  const VELOCIDADE_MIN   = 55;   // ms por caractere (mínimo)
  const VELOCIDADE_MAX   = 90;   // ms por caractere (máximo)
  const PAUSA_PONTUACAO  = [150, 400]; // pausa extra após , . … ; :
  const PAUSA_PARAGRAFO  = 500;  // pausa extra entre parágrafos
  const DURACAO_EXIBICAO = 3400; // tempo que o bloco fica parado na tela (ms)
  const AVANCO_RAPIDO    = 5;    // caracteres por frame ao segurar o lado direito/esquerdo

  /* ============================================================
     TEXTOS DA CARTA — edite os blocos e parágrafos livremente
     ============================================================ */
  const blocks = [
    [
      "Hoje não é apenas mais um dia.",
      "Hoje é o dia em que o mundo ganhou você.",
      "03 de setembro de 2026.",
      "O dia em que Larissa Passos de Jesus completa 25 anos."
    ],
    [
      "Entre Pouso Alegre, em Minas Gerais, onde você nasceu, e Perus, em São Paulo, onde estou, existem aproximadamente 150 quilômetros em linha reta.",
      "Mas há distâncias que mapa nenhum consegue medir.",
      "Porque, por mais longe que você esteja dos meus olhos, existe uma parte de você que permanece perto demais do meu coração."
    ],
    [
      "Você nasceu sob o signo de Virgem.",
      "Talvez por isso exista em você essa mistura tão bonita de força, inteligência, delicadeza e determinação.",
      "Uma mulher que observa o mundo com atenção…",
      "e que ainda tem muito mundo para transformar."
    ],
    [
      "Larissa,",
      "hoje eu quero te desejar tudo aquilo que a vida puder oferecer de mais bonito.",
      "Que nunca te faltem sonhos para perseguir, coragem para recomeçar, motivos para sorrir e pessoas capazes de reconhecer o tamanho da mulher que você é.",
      "E, se eu pudesse te desejar apenas uma coisa, seria esta:",
      "que você nunca deixe de acreditar na mulher extraordinária que existe dentro de você."
    ],
    [
      "Que você seja forte como a flor de lótus,",
      "que encontra forças para florescer mesmo quando suas raízes estão mergulhadas na escuridão.",
      "Que seja perfumada como o jasmim,",
      "deixando no mundo uma lembrança doce por onde passar."
    ],
    [
      "Que seja cintilante como um girassol,",
      "carregando luz mesmo quando o céu parece não querer oferecê-la.",
      "Que seja imponente como um carvalho,",
      "firme diante das tempestades e impossível de derrubar pela primeira ventania."
    ],
    [
      "Que seja fértil como um limoeiro,",
      "capaz de transformar cada estação da vida em frutos.",
      "Que seja grandiosa como uma sequoia,",
      "erguendo-se cada vez mais alto com o passar dos anos."
    ],
    [
      "Que tenha a profundidade de uma figueira,",
      "com raízes capazes de alcançar lugares que poucos conseguem enxergar.",
      "E que tenha a dureza de um quebracho,",
      "resistindo ao tempo, às tempestades e a tudo aquilo que tentar impedir o seu crescimento."
    ],
    [
      "E, entre todos esses desejos…",
      "existe um que talvez seja impossível esconder.",
      "Eu te desejo.",
      "Desejo sua presença, seu sorriso, seu olhar, sua voz, seus sonhos e tudo aquilo que ainda existe para descobrir em você.",
      "Existe uma parte de mim que gostaria de diminuir esses quilômetros todos…",
      "só para poder estar mais perto."
    ],
    [
      "Para mim, o seu aniversário é uma das datas mais importantes do calendário.",
      "Porque foi neste dia que nasceu aquela que eu acredito que pode se tornar uma das maiores cientistas contemporâneas do seu tempo.",
      "Eu acredito na sua inteligência.",
      "Acredito na sua capacidade.",
      "Acredito na sua ascensão.",
      "Acredito no futuro que ainda está esperando por você."
    ],
    [
      "E talvez a parte mais bonita seja saber que eu ainda posso assistir de perto, mesmo que à distância, ao seu desabrochar.",
      "Como quem observa uma flor rara abrir suas pétalas lentamente sob o primeiro raio de sol.",
      "Eu ficarei feliz em prestigiar cada conquista.",
      "Cada descoberta.",
      "Cada queda que você transformar em aprendizado.",
      "Cada sonho que você transformar em realidade.",
      "Porque acredito que ainda existe uma versão extraordinária de você que o mundo sequer conheceu."
    ],
    [
      "Feliz 25 anos, Larissa Passos de Jesus.",
      "Que os próximos capítulos sejam maiores do que tudo aquilo que você imaginou.",
      "Que a vida seja generosa com você.",
      "Que seus sonhos encontrem caminhos."
    ],
    [
      "Que sua ciência encontre descobertas.",
      "Que seu coração encontre paz.",
      "E que, onde quer que a vida nos leve…",
      "você nunca se esqueça de que existe alguém aqui,"
    ],
    [
      "a aproximadamente 150 quilômetros de você,",
      "que te admira,",
      "que acredita em você,",
      "que deseja você…",
      "e que deseja, sinceramente,"
    ],
    [
      "ver a mais bela flor que conhece desabrochar.",
      "Feliz aniversário, Larissa.",
      "Hoje o mundo comemora você.",
      "E eu também."
    ],
    [
      "Não vejo a hora de vê-la!"
    ]
  ];

  let flatTexts = []; // preenchido dinamicamente por prepararCarta()

  // ---------- Elementos ----------
  const bgVideo      = document.getElementById('bgVideo');
  const bgMusic       = document.getElementById('bgMusic');
  const startScreen   = document.getElementById('startScreen');
  const letterWrap     = document.getElementById('letterWrap');
  const letterText     = document.getElementById('letterText');
  const restartHint    = document.getElementById('restartHint');
  const touchLayer     = document.getElementById('touchLayer');
  const particlesBox   = document.getElementById('particles');

  bgVideo.src = BACKGROUND_URL;
  bgMusic.src = MUSIC_URL;

  // Garante que o vídeo de fundo NUNCA emita som (só a música em MUSIC_URL deve tocar)
  bgVideo.muted = true;
  bgVideo.volume = 0;
  bgVideo.defaultMuted = true;
  bgVideo.setAttribute('muted', '');

  // ---------- Partículas ----------
  function criarParticulas(qtd){
    for(let i=0;i<qtd;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const left = Math.random()*100;
      const dur = 9 + Math.random()*10;
      const delay = Math.random()*dur;
      const size = 2 + Math.random()*3;
      p.style.left = left + '%';
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.animationDuration = dur+'s';
      p.style.animationDelay = '-'+delay+'s';
      particlesBox.appendChild(p);
    }
  }
  criarParticulas(26);

  // ---------- Estado da carta ----------
  let blockIndex = 0;
  let revealCount = 0;
  let mode = 'idle';     // idle | typing | waiting | finished
  let holdDir = 0;       // -1 esquerda (voltar) | 0 nenhum | 1 direita (avançar)
  let acc = 0;
  let nextDelay = VELOCIDADE_MIN;
  let restartTimer = null;
  let lastFrame = null;
  let started = false;

  function fullLenAtual(){ return flatTexts[blockIndex].length; }

  // ============================================================
  // FONTE ÚNICA + DIVISÃO AUTOMÁTICA DE TELAS
  // A fonte é calculada uma única vez com base no BLOCO 1 (o
  // tamanho que você gostou) e usada igual em toda a carta.
  // Cada bloco original é então medido nessa fonte e, se não
  // couber inteiro no centro da tela, é dividido automaticamente
  // em mais telas (sempre entre parágrafos, nunca no meio de uma
  // frase). Assim o texto NUNCA fica cortado e NUNCA precisa de
  // rolagem — apenas aparece em mais "quadros" quando necessário.
  // ============================================================
  const FONTE_MAX = 24;
  const FONTE_MIN = 12.5;
  let fontSizeFixo = null;

  function calcularFontePadrao(){
    let fontSize = Math.min(FONTE_MAX, Math.max(15, window.innerWidth*0.05));
    letterText.style.fontSize = fontSize + 'px';
    letterText.innerHTML = blocks[0].join('\n\n').replace(/\n/g,'<br><br>');

    const alturaDisponivel = letterWrap.clientHeight - 40;
    let tentativas = 0;
    while(letterText.scrollHeight > alturaDisponivel && fontSize > FONTE_MIN && tentativas < 60){
      fontSize -= 0.5;
      letterText.style.fontSize = fontSize + 'px';
      tentativas++;
    }
    fontSizeFixo = fontSize;
  }

  function aplicarFontePadrao(){
    letterText.style.fontSize = fontSizeFixo + 'px';
  }

  // Divide cada bloco original em quantos "quadros" forem necessários
  // para que cada um caiba inteiro, sem cortar, na fonte fixa.
  function expandirBlocosParaCaber(){
    const alturaDisponivel = letterWrap.clientHeight - 40;
    letterText.style.fontSize = fontSizeFixo + 'px';
    const resultado = [];

    blocks.forEach(paragrafos => {
      let grupoAtual = [];
      paragrafos.forEach(paragrafo => {
        const tentativa = grupoAtual.concat([paragrafo]);
        letterText.innerHTML = tentativa.join('\n\n').replace(/\n/g,'<br><br>');
        if(grupoAtual.length === 0 || letterText.scrollHeight <= alturaDisponivel){
          grupoAtual = tentativa;
        } else {
          resultado.push(grupoAtual);
          grupoAtual = [paragrafo];
        }
      });
      if(grupoAtual.length > 0) resultado.push(grupoAtual);
    });

    return resultado;
  }

  function prepararCarta(){
    calcularFontePadrao();
    const blocosExpandido = expandirBlocosParaCaber();
    flatTexts = blocosExpandido.map(p => p.join('\n\n'));
    letterText.innerHTML = '';
  }

  function render(){
    const texto = flatTexts[blockIndex].slice(0, revealCount).replace(/\n/g,'<br><br>');
    letterText.innerHTML = texto;
  }

  function computarProximoDelay(charRevelado){
    let base = VELOCIDADE_MIN + Math.random()*(VELOCIDADE_MAX-VELOCIDADE_MIN);
    if(",.…;:".includes(charRevelado)){
      base += PAUSA_PONTUACAO[0] + Math.random()*(PAUSA_PONTUACAO[1]-PAUSA_PONTUACAO[0]);
    }
    if(charRevelado === "\n"){
      base += PAUSA_PARAGRAFO;
    }
    nextDelay = base;
  }

  let waitAcc = 0;   // tempo (ms) acumulado no estado 'waiting' (pode ser pausado)
  let fadeAcc = 0;   // tempo (ms) acumulado no estado 'fading' (pode ser pausado)
  let pausado = false; // true quando o dedo está no MEIO da tela (travar a escrita)

  const DURACAO_FADE = 600; // ms do fade suave entre blocos

  function mostrarDicaReiniciar(){
    restartTimer = setTimeout(()=>{
      restartHint.classList.add('visible');
    }, 2200);
  }

  // ---------- Loop principal ----------
  function loop(ts){
    if(!started){ return; }
    if(lastFrame === null) lastFrame = ts;
    const dt = ts - lastFrame;
    lastFrame = ts;

    if(holdDir === 1){
      // segurando lado direito: avança rápido
      letterText.classList.remove('hide');
      revealCount = Math.min(revealCount + AVANCO_RAPIDO, fullLenAtual());
      render();
      if(revealCount >= fullLenAtual()){
        if(blockIndex < flatTexts.length-1){
          blockIndex++;
          revealCount = 0;
          mode = 'typing';
          aplicarFontePadrao();
        } else {
          mode = 'finished';
          if(!restartTimer) mostrarDicaReiniciar();
        }
      }
    } else if(holdDir === -1){
      // segurando lado esquerdo: volta
      letterText.classList.remove('hide');
      revealCount = Math.max(revealCount - AVANCO_RAPIDO, 0);
      render();
      if(revealCount <= 0 && blockIndex > 0){
        blockIndex--;
        aplicarFontePadrao();
        revealCount = fullLenAtual();
        render();
      }
      restartHint.classList.remove('visible');
      mode = 'typing';
    } else if(pausado){
      // segurando o MEIO da tela: trava a escrita exatamente onde está.
      // Não avançamos nenhum acumulador (acc/waitAcc/fadeAcc), então ao
      // soltar o dedo tudo retoma do ponto exato em que parou.
    } else {
      // sem toque: comportamento automático
      if(mode === 'typing'){
        acc += dt;
        if(acc >= nextDelay){
          acc = 0;
          revealCount++;
          const charAtual = flatTexts[blockIndex][revealCount-1] || '';
          computarProximoDelay(charAtual);
          render();
          if(revealCount >= fullLenAtual()){
            if(blockIndex < flatTexts.length-1){
              mode = 'waiting';
              waitAcc = 0;
            } else {
              mode = 'finished';
              mostrarDicaReiniciar();
            }
          }
        }
      } else if(mode === 'waiting'){
        waitAcc += dt;
        if(waitAcc >= DURACAO_EXIBICAO){
          mode = 'fading';
          fadeAcc = 0;
          letterText.classList.add('hide');
        }
      } else if(mode === 'fading'){
        fadeAcc += dt;
        if(fadeAcc >= DURACAO_FADE){
          blockIndex++;
          revealCount = 0;
          aplicarFontePadrao();
          letterText.classList.remove('hide');
          mode = 'typing';
        }
      }
    }

    requestAnimationFrame(loop);
  }

  // ---------- Controle de toque ----------
  // Tela dividida em 3 zonas: esquerda (voltar), meio (pausar), direita (avançar)
  const ZONA_ESQUERDA = 0.33;
  const ZONA_DIREITA  = 0.67;

  function zonaDoToque(clientX){
    const w = window.innerWidth;
    if(clientX < w*ZONA_ESQUERDA) return 'esquerda';
    if(clientX > w*ZONA_DIREITA) return 'direita';
    return 'meio';
  }

  function onPointerDown(e){
    const x = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;

    if(!started){
      iniciarExperiencia();
      return;
    }

    if(mode === 'finished'){
      reiniciarExperiencia();
      return;
    }

    const zona = zonaDoToque(x);
    if(zona === 'meio'){
      pausado = true;
      holdDir = 0;
      return;
    }

    pausado = false;
    holdDir = (zona === 'esquerda') ? -1 : 1;
  }

  function onPointerUp(){
    holdDir = 0;
    pausado = false;
  }

  touchLayer.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
  touchLayer.addEventListener('touchstart', function(e){ e.preventDefault(); onPointerDown(e); }, {passive:false});
  window.addEventListener('touchend', onPointerUp);
  window.addEventListener('touchcancel', onPointerUp);

  // ---------- Início / Reinício ----------
  function reiniciarExperiencia(){
    clearTimeout(restartTimer); restartTimer = null;
    restartHint.classList.remove('visible');
    blockIndex = 0;
    revealCount = 0;
    acc = 0;
    waitAcc = 0;
    fadeAcc = 0;
    holdDir = 0;
    pausado = false;
    mode = 'typing';
    aplicarFontePadrao();
    letterText.classList.remove('hide');
    letterText.innerHTML = '';
    try{
      bgMusic.currentTime = 0;
      bgMusic.play().catch(()=>{});
    }catch(err){}
  }

  // Recalcula fonte + divisão automática das telas se o usuário girar o aparelho
  window.addEventListener('resize', function(){
    if(started){
      prepararCarta();
      reiniciarExperiencia();
    }
  });

  function iniciarExperiencia(){
    if(started) return;
    if(flatTexts.length === 0) prepararCarta(); // segurança, caso o toque seja muito rápido
    started = true;
    startScreen.classList.add('hidden');
    letterWrap.classList.add('visible');

    bgVideo.play().catch(()=>{});
    bgMusic.volume = 0.55;
    bgMusic.play().catch(()=>{});

    reiniciarExperiencia();
    lastFrame = null;
    requestAnimationFrame(loop);
  }

  startScreen.addEventListener('pointerdown', iniciarExperiencia);
  startScreen.addEventListener('touchstart', function(e){ e.preventDefault(); iniciarExperiencia(); }, {passive:false});

  // Prepara a fonte e a divisão automática das telas assim que possível.
  // Se a fonte do Google Fonts ainda estiver carregando, espera ela para
  // medir com precisão (evita divisões erradas por causa da fonte de fallback).
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(prepararCarta).catch(prepararCarta);
  } else {
    prepararCarta();
  }
